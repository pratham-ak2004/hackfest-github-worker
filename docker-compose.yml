volumes:
  hackfest-rabbitmq-data:
  hackfest-rabbitmq-logs:
  hackfest-redis-data:

services:
  rabbitmq:
    image: rabbitmq:4-management
    container_name: hackfest-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - hackfest-rabbitmq-data:/var/lib/rabbitmq
      - hackfest-rabbitmq-logs:/var/log/rabbitmq
    healthcheck:
      test: rabbitmq-diagnostics ping
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  postgres:
    image: postgres:18
    container_name: hackfest-postgres
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME} -h localhost"]
      interval: 30s
      timeout: 60s
      retries: 5
      start_period: 80s
    restart: unless-stopped

  worker:
    build:
      context: ./
      dockerfile: dockerfile
    command: python app.py
    env_file:
      - path: ./.env
        required: true
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped

  flower:
    build:
      context: ./
      dockerfile: dockerfile
    command: python app.py --flower
    ports:
      - "5555:5555"
    env_file:
      - path: ./.env
        required: true
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
      worker:
        condition: service_healthy
    restart: unless-stopped

  dashboard:
    build:
      context: ./
      dockerfile: dockerfile
    command: python app.py --dashboard
    env_file:
      - path: ./.env
        required: true
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped

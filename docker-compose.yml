volumes:
  hackfest-rabbitmq-data:
  hackfest-rabbitmq-logs:
  hackfest-redis-data:

services:
  rabbitmq:
    image: rabbitmq:4-management
    container_name: hackfest-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - hackfest-rabbitmq-data:/var/lib/rabbitmq
      - hackfest-rabbitmq-logs:/var/log/rabbitmq
    healthcheck:
      test: rabbitmq-diagnostics ping
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:8.4
    container_name: hackfest-redis
    command:
      - redis-server
      - --requirepass ${REDIS_PASSWORD}
      - --appendonly "yes"
      - --user ${REDIS_USERNAME}
      - "on"
      - ">${REDIS_PASSWORD}"
      - ~*
      - +@all
    ports:
      - "6379:6379"
    volumes:
      - hackfest-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  worker:
    build:
      context: ./
      dockerfile: dockerfile
      command: python app.py
    env_file:
      - path: ./.env
        required: true
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  flower:
    build:
      context: ./
      dockerfile: dockerfile
      command: python app.py --flower
    ports:
      - "5555:5555"
    env_file:
      - path: ./.env
        required: true
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

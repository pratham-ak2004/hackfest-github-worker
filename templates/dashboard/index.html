<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hackfest Celery Task Dashboard</title>
    <style>
      :root {
        --bg: #0f172a;
        --panel: #111827;
        --muted: #94a3b8;
        --text: #e2e8f0;
        --line: #1f2937;
        --ok: #10b981;
        --bad: #ef4444;
        --warn: #f59e0b;
        --info: #3b82f6;
        --chip: #1e293b;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          Segoe UI,
          Roboto,
          Helvetica,
          Arial,
          sans-serif;
        background: var(--bg);
        color: var(--text);
      }
      .container {
        max-width: 1500px;
        margin: 0 auto;
        padding: 20px;
      }
      .topbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        margin-bottom: 16px;
      }
      .title {
        font-size: 24px;
        font-weight: 700;
      }
      .sub {
        color: var(--muted);
        font-size: 13px;
      }
      .controls {
        display: flex;
        gap: 8px;
        align-items: center;
        flex-wrap: wrap;
      }
      .card-grid {
        display: grid;
        grid-template-columns: repeat(7, minmax(130px, 1fr));
        gap: 10px;
        margin-bottom: 14px;
      }
      .card {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 12px;
        min-height: 82px;
      }
      .label {
        color: var(--muted);
        font-size: 12px;
        margin-bottom: 6px;
      }
      .value {
        font-size: 22px;
        font-weight: 700;
      }
      .table-wrap {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 12px;
        overflow: hidden;
      }
      .filter-row {
        display: grid;
        grid-template-columns: 180px 1fr 1fr 100px auto;
        gap: 8px;
        padding: 10px;
        border-bottom: 1px solid var(--line);
        background: #0b1220;
      }
      input,
      select,
      button {
        border-radius: 8px;
        border: 1px solid var(--line);
        background: #0f172a;
        color: var(--text);
        padding: 8px 10px;
        font-size: 13px;
      }
      button {
        cursor: pointer;
      }
      button.primary {
        background: var(--info);
        border-color: var(--info);
        color: white;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        table-layout: fixed;
        font-size: 12px;
      }
      th,
      td {
        text-align: left;
        border-bottom: 1px solid var(--line);
        padding: 9px 10px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      th {
        color: var(--muted);
        font-weight: 600;
      }
      tr:hover {
        background: #101a2a;
      }
      .chip {
        display: inline-flex;
        align-items: center;
        border-radius: 999px;
        background: var(--chip);
        border: 1px solid var(--line);
        padding: 2px 8px;
        font-size: 11px;
        line-height: 1.4;
      }
      .SUCCESS {
        color: var(--ok);
      }
      .FAILURE {
        color: var(--bad);
      }
      .PENDING,
      .RETRY {
        color: var(--warn);
      }
      .STARTED {
        color: var(--info);
      }
      .bottom {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 10px;
        color: var(--muted);
        font-size: 12px;
      }
      .detail {
        margin-top: 14px;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 12px;
        min-height: 280px;
      }
      .detail-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
      }
      .box {
        background: #0b1220;
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 10px;
      }
      .box h4 {
        margin: 0 0 8px 0;
        font-size: 13px;
        color: var(--muted);
      }
      pre {
        margin: 0;
        font-size: 12px;
        line-height: 1.4;
        white-space: pre-wrap;
        word-break: break-word;
        color: #d1e3ff;
        max-height: 280px;
        overflow: auto;
      }
      .status-strip {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-bottom: 12px;
      }
      .status-item {
        border: 1px solid var(--line);
        background: #0b1220;
        border-radius: 8px;
        padding: 6px 10px;
        font-size: 12px;
        color: var(--muted);
      }
      .sync-panel {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 12px;
        margin-bottom: 14px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
      }
      .sync-info {
        display: flex;
        gap: 12px;
        align-items: center;
        flex-wrap: wrap;
      }
      .sync-badge {
        padding: 4px 10px;
        border-radius: 6px;
        font-size: 12px;
        font-weight: 600;
      }
      .sync-badge.running {
        background: #10b98120;
        color: var(--ok);
      }
      .sync-badge.stopped {
        background: #94a3b820;
        color: var(--muted);
      }
      button.danger {
        background: var(--bad);
        border-color: var(--bad);
        color: white;
      }
      button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="topbar">
        <div>
          <div class="title">Hackfest Celery Task Dashboard</div>
          <div class="sub" id="lastUpdated">Loading…</div>
        </div>
        <div class="controls">
          <label class="sub">Auto refresh</label>
          <select id="refreshSeconds">
            <option value="0">Off</option>
            <option value="5">5s</option>
            <option value="10" selected>10s</option>
            <option value="30">30s</option>
          </select>
          <button class="primary" id="refreshNow">Refresh now</button>
        </div>
      </div>

      <div class="card-grid" id="summaryCards"></div>
      <div class="status-strip" id="statusBreakdown"></div>

      <!-- Sync Control Panel -->
      <div class="sync-panel">
        <div class="sync-info">
          <div>
            <span class="label">Sync Status:</span>
            <span class="sync-badge" id="syncBadge">STOPPED</span>
          </div>
          <div class="sub" id="syncStats">-</div>
        </div>
        <div class="controls">
          <button id="syncStart" class="primary">Start Sync</button>
          <button id="syncStop" class="danger" disabled>Stop Sync</button>
          <button id="syncReset" disabled>Reset</button>
        </div>
      </div>

      <div class="table-wrap">
        <div class="filter-row">
          <select id="statusFilter">
            <option value="">All Status</option>
            <option value="SUCCESS">SUCCESS</option>
            <option value="FAILURE">FAILURE</option>
            <option value="PENDING">PENDING</option>
            <option value="STARTED">STARTED</option>
            <option value="RETRY">RETRY</option>
          </select>
          <input
            id="taskNameFilter"
            placeholder="Filter by task name (contains)"
          />
          <input id="taskIdFilter" placeholder="Filter by task id (contains)" />
          <input id="limitInput" type="number" min="10" max="500" value="50" />
          <button id="applyFilter">Apply</button>
        </div>
        <table>
          <thead>
            <tr>
              <th style="width: 180px">Date Done</th>
              <th style="width: 290px">Task Name</th>
              <th style="width: 275px">Task ID</th>
              <th style="width: 90px">Status</th>
              <th style="width: 120px">Worker</th>
              <th style="width: 80px">Retries</th>
              <th style="width: 120px">Queue</th>
            </tr>
          </thead>
          <tbody id="tasksBody"></tbody>
        </table>
        <div class="bottom">
          <div id="paginationInfo">-</div>
          <div class="controls">
            <button id="prevPage">Prev</button>
            <button id="nextPage">Next</button>
          </div>
        </div>
      </div>

      <div class="detail" id="detailPanel">
        <div class="sub" style="margin-bottom: 10px">
          Click a row to inspect task details
        </div>
        <div id="detailMeta"></div>
        <div class="detail-grid">
          <div class="box">
            <h4>Args</h4>
            <pre id="detailArgs">-</pre>
          </div>
          <div class="box">
            <h4>Kwargs</h4>
            <pre id="detailKwargs">-</pre>
          </div>
          <div class="box">
            <h4>Result</h4>
            <pre id="detailResult">-</pre>
          </div>
          <div class="box">
            <h4>Traceback</h4>
            <pre id="detailTraceback">-</pre>
          </div>
        </div>
      </div>
    </div>

    <script>
      const state = {
        offset: 0,
        total: 0,
        limit: 50,
        selectedTaskId: null,
        timer: null,
      };

      function fmtDate(iso) {
        if (!iso) return "-";
        const d = new Date(iso);
        if (Number.isNaN(d.getTime())) return iso;
        return d.toLocaleString();
      }

      function pretty(v) {
        if (v === null || v === undefined) return "-";
        if (typeof v === "string") return v;
        try {
          return JSON.stringify(v, null, 2);
        } catch {
          return String(v);
        }
      }

      function card(label, value, cls = "") {
        return `<div class="card"><div class="label">${label}</div><div class="value ${cls}">${value}</div></div>`;
      }

      async function loadStats() {
        const res = await fetch("/api/stats");
        const data = await res.json();
        const s = data.summary || {};
        const cards = [
          card("Total", s.total ?? 0),
          card("Success", s.success ?? 0, "SUCCESS"),
          card("Failure", s.failure ?? 0, "FAILURE"),
          card("Pending", s.pending ?? 0, "PENDING"),
          card("Started", s.started ?? 0, "STARTED"),
          card("Retry", s.retry ?? 0, "RETRY"),
          card("Success Rate", `${s.success_rate ?? 0}%`),
        ];
        document.getElementById("summaryCards").innerHTML = cards.join("");

        const breakdown = (data.status_breakdown || []).map(
          (it) =>
            `<div class="status-item"><span class="${it.status}">${it.status}</span> · ${it.count}</div>`,
        );
        document.getElementById("statusBreakdown").innerHTML =
          breakdown.join("");
        document.getElementById("lastUpdated").innerText =
          `Last updated: ${fmtDate(data.generated_at)}`;
      }

      function currentFilters() {
        return {
          status: document.getElementById("statusFilter").value,
          task_name: document.getElementById("taskNameFilter").value.trim(),
          task_id_contains: document
            .getElementById("taskIdFilter")
            .value.trim(),
        };
      }

      async function loadTasks() {
        const filters = currentFilters();
        state.limit = Number(document.getElementById("limitInput").value || 50);

        const params = new URLSearchParams({
          ...Object.fromEntries(Object.entries(filters).filter(([, v]) => v)),
          limit: String(state.limit),
          offset: String(state.offset),
        });

        const res = await fetch(`/api/tasks?${params.toString()}`);
        const data = await res.json();
        state.total = data.total || 0;

        const rows = (data.items || []).map(
          (item) => `
        <tr data-taskid="${item.task_id || ""}">
          <td>${fmtDate(item.date_done)}</td>
          <td title="${item.name}">${item.name}</td>
          <td title="${item.task_id || "-"}">${item.task_id || "-"}</td>
          <td><span class="chip ${item.status}">${item.status}</span></td>
          <td title="${item.worker}">${item.worker}</td>
          <td>${item.retries}</td>
          <td title="${item.queue}">${item.queue}</td>
        </tr>
      `,
        );

        const tbody = document.getElementById("tasksBody");
        tbody.innerHTML =
          rows.join("") || '<tr><td colspan="7">No tasks found.</td></tr>';

        [...tbody.querySelectorAll("tr[data-taskid]")].forEach((tr) => {
          tr.addEventListener("click", () => {
            const id = tr.getAttribute("data-taskid");
            if (id) {
              state.selectedTaskId = id;
              loadTaskDetail(id);
            }
          });
        });

        const from = state.total === 0 ? 0 : state.offset + 1;
        const to = Math.min(state.offset + state.limit, state.total);
        document.getElementById("paginationInfo").innerText =
          `Showing ${from}-${to} of ${state.total}`;
      }

      async function loadTaskDetail(taskId) {
        const res = await fetch(`/api/tasks/${encodeURIComponent(taskId)}`);
        if (!res.ok) {
          document.getElementById("detailMeta").innerHTML =
            '<span class="FAILURE">Unable to load task details</span>';
          return;
        }
        const task = await res.json();

        document.getElementById("detailMeta").innerHTML = `
        <div class="status-strip">
          <div class="status-item">Task ID: ${task.task_id || "-"}</div>
          <div class="status-item">Status: <span class="${task.status}">${task.status}</span></div>
          <div class="status-item">Name: ${task.name}</div>
          <div class="status-item">Date Done: ${fmtDate(task.date_done)}</div>
        </div>
      `;
        document.getElementById("detailArgs").innerText = pretty({
          format: task.args?.format,
          value: task.args?.decoded,
        });
        document.getElementById("detailKwargs").innerText = pretty({
          format: task.kwargs?.format,
          value: task.kwargs?.decoded,
        });
        document.getElementById("detailResult").innerText = pretty({
          format: task.result?.format,
          value: task.result?.decoded,
        });
        document.getElementById("detailTraceback").innerText =
          task.traceback || "-";
      }

      async function loadSyncStatus() {
        try {
          const res = await fetch("/api/sync/status");
          const data = await res.json();

          const badge = document.getElementById("syncBadge");
          const stats = document.getElementById("syncStats");
          const startBtn = document.getElementById("syncStart");
          const stopBtn = document.getElementById("syncStop");
          const resetBtn = document.getElementById("syncReset");

          if (data.running) {
            badge.textContent = "RUNNING";
            badge.className = "sync-badge running";
            startBtn.disabled = true;
            stopBtn.disabled = false;
            resetBtn.disabled = true;
          } else {
            badge.textContent = "STOPPED";
            badge.className = "sync-badge stopped";
            startBtn.disabled = false;
            stopBtn.disabled = true;
            resetBtn.disabled = false;
          }

          const lastSync = data.last_sync ? fmtDate(data.last_sync) : "Never";
          const errText =
            data.total_errors > 0 ? ` · ${data.total_errors} errors` : "";
          stats.textContent = `Synced: ${data.synced_count} · Last: ${lastSync} · Poll: ${data.poll_interval}s${errText}`;
        } catch (err) {
          console.error("Failed to load sync status:", err);
        }
      }

      async function startSync() {
        try {
          const res = await fetch("/api/sync/start", { method: "POST" });
          const data = await res.json();
          alert(data.message || "Sync started");
          await loadSyncStatus();
        } catch (err) {
          alert("Failed to start sync: " + err);
        }
      }

      async function stopSync() {
        try {
          const res = await fetch("/api/sync/stop", { method: "POST" });
          const data = await res.json();
          alert(data.message || "Sync stopped");
          await loadSyncStatus();
        } catch (err) {
          alert("Failed to stop sync: " + err);
        }
      }

      async function resetSync() {
        if (
          !confirm(
            "Reset sync state? This will clear counters and start from the beginning.",
          )
        )
          return;
        try {
          const res = await fetch("/api/sync/reset", { method: "POST" });
          const data = await res.json();
          alert(data.message || "Sync reset");
          await loadSyncStatus();
        } catch (err) {
          alert("Failed to reset sync: " + err);
        }
      }

      async function loadAll() {
        await Promise.all([loadStats(), loadTasks(), loadSyncStatus()]);
        if (state.selectedTaskId) {
          loadTaskDetail(state.selectedTaskId);
        }
      }

      function setupAutoRefresh() {
        if (state.timer) {
          clearInterval(state.timer);
          state.timer = null;
        }
        const seconds = Number(
          document.getElementById("refreshSeconds").value || 0,
        );
        if (seconds > 0) {
          state.timer = setInterval(loadAll, seconds * 1000);
        }
      }

      document.getElementById("applyFilter").addEventListener("click", () => {
        state.offset = 0;
        loadTasks();
      });
      document.getElementById("refreshNow").addEventListener("click", loadAll);
      document
        .getElementById("refreshSeconds")
        .addEventListener("change", setupAutoRefresh);

      document.getElementById("prevPage").addEventListener("click", () => {
        state.offset = Math.max(0, state.offset - state.limit);
        loadTasks();
      });
      document.getElementById("nextPage").addEventListener("click", () => {
        if (state.offset + state.limit < state.total) {
          state.offset += state.limit;
          loadTasks();
        }
      });

      // Sync control event listeners
      document.getElementById("syncStart").addEventListener("click", startSync);
      document.getElementById("syncStop").addEventListener("click", stopSync);
      document.getElementById("syncReset").addEventListener("click", resetSync);

      loadAll();
      setupAutoRefresh();
    </script>
  </body>
</html>
